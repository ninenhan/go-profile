nested:
  value: "${PROFILE_COLLECTION_NESTED:}"
list:
  - "${PROFILE_COLLECTION_LIST_FIRST:}"
  - "${PROFILE_COLLECTION_LIST_SECOND:second-default}"
  - "${PROFILE_COLLECTION_LIST_EMPTY:}"
inline_list: ["${PROFILE_COLLECTION_INLINE_FIRST:}", "${PROFILE_COLLECTION_INLINE_SECOND:inline-default}", "${PROFILE_COLLECTION_INLINE_EMPTY:}"]
inline_map: {empty: "${PROFILE_COLLECTION_MAP_EMPTY:}", set: "${PROFILE_COLLECTION_MAP_SET:default}"}
dynamic_map:
  ${PROFILE_COLLECTION_DYNAMIC_KEY:key-default}: "${PROFILE_COLLECTION_DYNAMIC_VALUE:}"
